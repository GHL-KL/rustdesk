name: Build RustDesk 1.3.6 Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg
          key: vcpkg-win-2024-11-16-libvpx-libyuv-opus-aom

      - name: Setup VCPKG
        shell: pwsh
        run: |
          if (!(Test-Path "vcpkg\vcpkg.exe")) {
            if (!(Test-Path "vcpkg")) {
              git clone https://github.com/microsoft/vcpkg.git
            }
            cd vcpkg
            git checkout 2024.11.16
            .\bootstrap-vcpkg.bat
            cd ..
          }
          .\vcpkg\vcpkg.exe install --classic `
            libvpx:x64-windows-static `
            libyuv:x64-windows-static `
            opus:x64-windows-static `
            aom:x64-windows-static
          echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" >> $env:GITHUB_ENV

      - name: Flutter pub get
        shell: pwsh
        run: |
          cd flutter
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cd ..

      - name: Build virtual display DLL
        shell: pwsh
        run: |
          cd libs\virtual_display\dylib
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cd ..\..\..

      - name: Build Rust Library
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          RENDEZVOUS_SERVER: support.myGHL.com
          RS_PUB_KEY: hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ=
        run: |
          cargo build --features flutter --lib --release
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Cargo build fehlgeschlagen!"
            exit 1
          }
          if (-not (Test-Path "target\release\librustdesk.dll")) {
            Write-Error "librustdesk.dll nicht gefunden!"
            exit 1
          }
          Write-Host "✓ librustdesk.dll erfolgreich gebaut"

      - name: Build Flutter Windows
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          RENDEZVOUS_SERVER: support.myGHL.com
          RS_PUB_KEY: hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ=
        run: |
          # d3d11-Patch: JETZT anwenden, da flutter pub get die Plugin-Quellen 
          # im Pub-Cache registriert hat. Wir patchen das dart_windows Plugin direkt.
          $pubCache = (flutter pub cache path 2>$null)
          if (-not $pubCache) { $pubCache = "$env:LOCALAPPDATA\Pub\Cache" }
          $d3dFiles = Get-ChildItem -Path $pubCache -Filter "d3d11_output.cpp" -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $d3dFiles) {
            $content = Get-Content $file.FullName -Raw
            if ($content -notmatch "#include <chrono>") {
              $patched = "#include <chrono>`n#include <ratio>`n" + $content
              [System.IO.File]::WriteAllText($file.FullName, $patched, [System.Text.Encoding]::UTF8)
              Write-Host "Gepatcht: $($file.FullName)"
            }
          }

          cd flutter
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Flutter build fehlgeschlagen!"
            exit 1
          }
          cd ..

          $buildDir = "flutter\build\windows\x64\runner\Release"
          Copy-Item "target\release\deps\dylib_virtual_display.dll" $buildDir -Force
          Write-Host "✓ Flutter Build + DLL-Kopie erfolgreich"

      - name: Build Portable Installer
        shell: pwsh
        env:
          RENDEZVOUS_SERVER: support.myGHL.com
          RS_PUB_KEY: hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ=
        run: |
          $version = python -c @"
          with open('Cargo.toml', encoding='utf-8') as f:
              for line in f:
                  if line.startswith('version'):
                      print(line.split('=')[1].strip().strip('\"'))
                      break
          "@
          Write-Host "Version: $version"

          $flutterBuildDir = "${{ github.workspace }}\flutter\build\windows\x64\runner\Release"
          $exePath = "$flutterBuildDir\rustdesk.exe"

          cd libs\portable
          pip install -r requirements.txt
          python generate.py -f $flutterBuildDir -o . -e $exePath
          if ($LASTEXITCODE -ne 0) {
            Write-Error "generate.py fehlgeschlagen!"
            exit 1
          }
          cd ..\..

          # Packer-EXE finden und umbenennen
          $packerSrc = "target\release\rustdesk-portable-packer.exe"
          if (Test-Path $packerSrc) {
            Copy-Item $packerSrc "Support-GHL.exe" -Force
          } else {
            # Fallback: direkt rustdesk.exe aus dem Flutter-Build nehmen
            Write-Host "Portable Packer nicht gefunden – nehme Flutter-Build direkt"
            Copy-Item $exePath "Support-GHL.exe" -Force
          }

          if (Test-Path "Support-GHL.exe") {
            Write-Host "✓ Support-GHL.exe erstellt"
          } else {
            Write-Error "Support-GHL.exe nicht gefunden!"
            exit 1
          }

      - name: Upload Support Client
        uses: actions/upload-artifact@v4
        with:
          name: Support-GHL-Windows
          path: Support-GHL.exe
