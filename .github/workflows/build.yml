name: Build RustDesk 1.4.6 Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Patch Server Config
        shell: python
        run: |
          import re, sys

          path = r"libs\hbb_common\src\config.rs"
          with open(path, encoding="utf-8") as f:
              content = f.read()

          original = content

          # RENDEZVOUS_SERVERS ersetzen
          content = re.sub(
              r'(pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[)[^\]]*(\];)',
              r'\g<1>"support.myghl.com"\g<2>',
              content, flags=re.DOTALL
          )

          # RS_PUB_KEY: option_env! Fallback ersetzen (1.4.x Stil)
          content = re.sub(
              r'(pub const RS_PUB_KEY: &str = match option_env!\("RS_PUB_KEY"\) \{[^}]*_ => ")[^"]*(")',
              r'\g<1>hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ=\g<2>',
              content, flags=re.DOTALL
          )

          # Fallback: RS_PUB_KEY als einfacher String-Literal
          if "hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ=" not in content:
              content = re.sub(
                  r'pub const RS_PUB_KEY: &str = "[^"]*"',
                  'pub const RS_PUB_KEY: &str = "hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ="',
                  content
              )

          if "support.myghl.com" not in content:
              print("FEHLER: RENDEZVOUS_SERVERS Patch hat nicht funktioniert!", file=sys.stderr)
              print("Aktuelle RENDEZVOUS_SERVERS-Zeilen:")
              for i, line in enumerate(content.splitlines()):
                  if "RENDEZVOUS" in line:
                      print(f"  Zeile {i}: {line}")
              sys.exit(1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Patch erfolgreich:")
          for line in content.splitlines():
              if "RENDEZVOUS_SERVERS" in line or "RS_PUB_KEY" in line:
                  print(" ", line.strip())

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm -y
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=C:\Program Files\LLVM\bin"

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg
          key: vcpkg-win-146-120deac3

      - name: Setup VCPKG
        shell: pwsh
        run: |
          if (!(Test-Path "vcpkg\vcpkg.exe")) {
            if (!(Test-Path "vcpkg")) { git clone https://github.com/microsoft/vcpkg.git }
            Set-Location vcpkg
            git checkout 120deac3062162151622ca4860575a33844ba10b
            .\bootstrap-vcpkg.bat
            Set-Location ..
          }
          .\vcpkg\vcpkg.exe install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=${{ github.workspace }}/vcpkg"

      - name: Flutter pub get
        shell: pwsh
        run: |
          Set-Location flutter
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location ..

      - name: Install flutter_rust_bridge_codegen
        shell: pwsh
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"

      - name: Generate Bridge Code
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --rust-output src/bridge_generated.rs --dart-output flutter/lib/generated_bridge.dart --no-build-runner
          if ($LASTEXITCODE -ne 0) { Write-Error "flutter_rust_bridge_codegen fehlgeschlagen!"; exit 1 }
          if (-not (Test-Path "src\bridge_generated.rs")) { Write-Error "bridge_generated.rs fehlt!"; exit 1 }
          Write-Host "bridge_generated.rs erstellt"
          Set-Location flutter
          dart run build_runner build --delete-conflicting-outputs
          if ($LASTEXITCODE -ne 0) { Write-Error "build_runner fehlgeschlagen!"; exit 1 }
          Set-Location ..
          Write-Host "Bridge Code vollstaendig generiert"

      - name: Build virtual display DLL
        shell: pwsh
        run: |
          Set-Location libs\virtual_display\dylib
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location ..\..\..

      - name: Build Rust Library
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          RENDEZVOUS_SERVER: support.myghl.com
          RS_PUB_KEY: hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ=
        run: |
          cargo build --features flutter --lib --release
          if ($LASTEXITCODE -ne 0) { Write-Error "Cargo build fehlgeschlagen!"; exit 1 }
          if (-not (Test-Path "target\release\librustdesk.dll")) { Write-Error "librustdesk.dll fehlt!"; exit 1 }
          Write-Host "librustdesk.dll gebaut"

      - name: Build Flutter Windows
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          RENDEZVOUS_SERVER: support.myghl.com
          RS_PUB_KEY: hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ=
        run: |
          $pubCache = "$env:LOCALAPPDATA\Pub\Cache"
          Get-ChildItem -Path $pubCache -Filter "d3d11_output.cpp" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            if ($c -notmatch "#include <chrono>") {
              [System.IO.File]::WriteAllText($_.FullName, "#include <chrono>`n#include <ratio>`n" + $c, [System.Text.Encoding]::UTF8)
              Write-Host "d3d11 gepatcht: $($_.FullName)"
            }
          }
          Set-Location flutter
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { Write-Error "Flutter build fehlgeschlagen!"; exit 1 }
          Set-Location ..
          Copy-Item "target\release\deps\dylib_virtual_display.dll" "flutter\build\windows\x64\runner\Release" -Force
          Write-Host "Flutter Build abgeschlossen"

      - name: Build Portable Installer
        shell: pwsh
        env:
          RENDEZVOUS_SERVER: support.myghl.com
          RS_PUB_KEY: hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ=
        run: |
          $flutterBuildDir = "flutter\build\windows\x64\runner\Release"
          $exePath = "$flutterBuildDir\rustdesk.exe"
          Set-Location libs\portable
          pip install -r requirements.txt
          python generate.py -f "..\..\$flutterBuildDir" -o . -e "..\..\$exePath"
          if ($LASTEXITCODE -ne 0) { Write-Error "generate.py fehlgeschlagen!"; exit 1 }
          Set-Location ..\..
          $packerSrc = "target\release\rustdesk-portable-packer.exe"
          if (Test-Path $packerSrc) {
            Copy-Item $packerSrc "Support-GHL.exe" -Force
          } else {
            Write-Host "Portable Packer nicht gefunden - nehme rustdesk.exe direkt"
            Copy-Item $exePath "Support-GHL.exe" -Force
          }
          if (-not (Test-Path "Support-GHL.exe")) { Write-Error "Support-GHL.exe fehlt!"; exit 1 }
          Write-Host "Support-GHL.exe erstellt"

      - name: Upload Support Client
        uses: actions/upload-artifact@v4
        with:
          name: Support-GHL-Windows
          path: Support-GHL.exe
