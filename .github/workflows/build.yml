name: Build RustDesk 1.3.6 Windows Custom

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-2022
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5' 
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install LLVM
        run: choco install llvm -y
        shell: pwsh

      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Setup VCPKG
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          ./vcpkg install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
        shell: bash

      - name: Patch Config (Hardcoded Fallbacks)
        shell: bash
        run: |
          # Wir patchen nur die harten Fallbacks, falls keine Env-Vars gesetzt sind
          MY_SERVER="support.myGHL.com"
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i "s/rs-ny.rustdesk.com/$MY_SERVER/g" $CONFIG_FILE

      - name: Generate Bridge Code
        shell: pwsh
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: |
          # 1. Flutter-Umgebung vervollständigen
          $env:PATH += ";C:\Program Files\LLVM\bin"
          flutter precache
          
          # 2. Abhängigkeiten im Flutter-Ordner laden
          cd flutter
          flutter pub get
          cd ..
          
          # 3. Datei-Eingang bestimmen
          $rustInput = ""
          if (Test-Path "src\flutter_ffi.rs") { $rustInput = "src/flutter_ffi.rs" }
          elseif (Test-Path "src\api.rs") { $rustInput = "src/api.rs" }
          
          # 4. Codegen OHNE automatischen build_runner ausführen
          # Wir nutzen --skip-build-runner, damit das Tool nicht selbst abstürzt
          $codegen = "$env:USERPROFILE\.cargo\bin\flutter_rust_bridge_codegen.exe"
          & $codegen --rust-input $rustInput `
                     --rust-output src/bridge_generated.rs `
                     --dart-output flutter/lib/bridge_generated.dart `
                     --skip-build-runner
          
          # 5. Build-Runner manuell starten (hier haben wir bessere Logs)
          cd flutter
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build RustDesk
        shell: cmd
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          # Hier setzen wir deine Server-Daten als Build-Umgebungsvariablen
          RENDEZVOUS_SERVER: support.myGHL.com
          RS_PUB_KEY: hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ=
        run: |
          :: Den Build starten
          python build.py --portable --flutter

      - name: Rename Executable
        shell: pwsh
        run: |
          # RustDesk legt die Datei je nach Build-Art an unterschiedliche Orte
          $exePath = Get-ChildItem -Path . -Filter "rustdesk.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($exePath) {
            Move-Item -Path $exePath -Destination "Support-GHL.exe" -Force
            Write-Host "Erfolg: Datei gefunden unter $exePath"
          } else {
            Write-Error "Fehler: rustdesk.exe wurde nirgendwo gefunden!"
            Get-ChildItem -Path . -Recurse -Filter "*.exe"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Support-Client-Windows
          path: Support-GHL.exe
