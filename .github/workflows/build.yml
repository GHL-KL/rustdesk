name: Build RustDesk 1.3.6 Windows Custom

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-2022
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Zurück auf 3.19.6 für bessere Code-Kompatibilität
          flutter-version: '3.19.6' 
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install LLVM
        run: choco install llvm -y
        shell: pwsh

      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Patch Dependencies (Fix for Flutter 3.19)
        shell: bash
        run: |
          cd flutter
          # Verhindert, dass neuere Versionen geladen werden, die Dart 3.5 erfordern
          sed -i 's/extended_text: ^/extended_text: 13.0.0 #/g' pubspec.yaml
          sed -i 's/extended_text_field: ^/extended_text_field: 13.0.0 #/g' pubspec.yaml
          # Falls pubspec.lock existiert, löschen wir es für einen sauberen Stand
          rm -f pubspec.lock

      - name: Setup VCPKG
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          ./vcpkg install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
        shell: bash

      - name: Generate Bridge Code
        shell: pwsh
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: |
          $env:PATH += ";C:\Program Files\LLVM\bin"
          flutter doctor
          flutter precache --windows
          
          cd flutter
          flutter pub get
          cd ..
          
          $rustInput = ""
          if (Test-Path "src\flutter_ffi.rs") { $rustInput = "src/flutter_ffi.rs" }
          elseif (Test-Path "src\api.rs") { $rustInput = "src/api.rs" }
          
          # KORREKTUR: Der Dateiname MUSS generated_bridge.dart lauten
          $codegen = "$env:USERPROFILE\.cargo\bin\flutter_rust_bridge_codegen.exe"
          & $codegen --rust-input $rustInput `
                     --rust-output src/bridge_generated.rs `
                     --dart-output flutter/lib/generated_bridge.dart `
                     --no-build-runner
          
          cd flutter
          dart run build_runner build --delete-conflicting-outputs

      - name: Build RustDesk
        shell: cmd
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          RENDEZVOUS_SERVER: support.myGHL.com
          RS_PUB_KEY: hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ=
        run: |
          python build.py --portable --flutter

      - name: Rename Executable
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path . -Filter "rustdesk.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($exePath) {
            Move-Item -Path $exePath -Destination "Support-GHL.exe" -Force
          } else {
            Write-Error "rustdesk.exe nicht gefunden!"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Support-Client-Windows
          path: Support-GHL.exe
