name: Build RustDesk 1.3.6 Windows Custom

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-2022
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6' 
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      # 1. Tool installieren (wie gehabt)
      - name: Install flutter_rust_bridge_codegen
        # Wir installieren es und stellen sicher, dass es im Cargo-Bin landet
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1
        shell: bash

      - name: Setup VCPKG (C++ Dependencies)
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          ./vcpkg install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
        shell: bash

      - name: Patch Config (Hardcoding Server)
        shell: bash
        run: |
          MY_SERVER="support.myGHL.com"
          MY_KEY="hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ="
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i '58,61c\    pub static ref PROD_RENDEZVOUS_SERVER: RwLock<String> = RwLock::new("'$MY_SERVER'".to_string());' $CONFIG_FILE
          sed -i "s/rs-ny.rustdesk.com/$MY_SERVER/g" $CONFIG_FILE
          sed -i "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|$MY_KEY|g" $CONFIG_FILE

      - name: Generate Bridge Code
        # Wir nutzen CMD, um Windows-Pfadvariablen direkt zu nutzen
        shell: cmd
        run: |
          "%USERPROFILE%\.cargo\bin\flutter_rust_bridge_codegen.exe" --rust-input src\api.rs --rust-output src\bridge_generated.rs --dart-output flutter\lib\bridge_generated.dart

      - name: Build RustDesk
        shell: cmd
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          python build.py --portable --flutter

      # 2. WICHTIG: Cargo Bin Verzeichnis zum Pfad hinzufügen
      - name: Add Cargo bin to PATH
        run: echo "$USERPROFILE\.cargo\bin" >> $GITHUB_PATH
        shell: bash

      - name: Setup VCPKG
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          ./vcpkg install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
        shell: bash

      # 3. Patch Config (hier nichts ändern)
      - name: Patch Config (Hardcoding Server)
        shell: bash
        run: |
          MY_SERVER="support.myGHL.com"
          MY_KEY="hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ="
          CONFIG_FILE="libs/hbb_common/src/config.rs"
          sed -i '58,61c\    pub static ref PROD_RENDEZVOUS_SERVER: RwLock<String> = RwLock::new("'$MY_SERVER'".to_string());' $CONFIG_FILE
          sed -i "s/rs-ny.rustdesk.com/$MY_SERVER/g" $CONFIG_FILE
          sed -i "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|$MY_KEY|g" $CONFIG_FILE

      # 4. Bridge Code generieren
      # Wir rufen es jetzt über "call" oder direkt auf, da der Pfad nun bekannt ist
      - name: Generate Bridge Code
        run: |
          flutter_rust_bridge_codegen --rust-input src/api.rs --rust-output src/bridge_generated.rs --dart-output flutter/lib/bridge_generated.dart
        shell: bash

      # NEU: Generiere den Brückencode explizit
      - name: Generate Bridge Code
        run: |
          flutter_rust_bridge_codegen --rust-input src/api.rs --rust-output src/bridge_generated.rs --dart-output flutter/lib/bridge_generated.dart
        shell: bash

      - name: Build RustDesk
        shell: cmd
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          python build.py --portable --flutter

      - name: Rename Executable
        shell: bash
        run: |
          cd build/release
          mv rustdesk.exe "Support-GHL.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Support-Client-Windows
          path: build/release/Support-GHL.exe
