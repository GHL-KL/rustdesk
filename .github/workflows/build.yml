name: Build RustDesk 1.3.6 Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6' 
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install LLVM
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Patch Flutter & C++ Plugins
        shell: pwsh
        run: |
          cd flutter
          # 1. Pubspec Smart Patch (gegen Duplicate Key Error)
          $path = "pubspec.yaml"
          $content = Get-Content $path -Raw
          if ($content -match "dependency_overrides:") {
              $content = $content -replace "dependency_overrides:", "dependency_overrides:`n  extended_text: 13.0.0`n  extended_text_field: 13.0.0"
          } else {
              $content += "`ndependency_overrides:`n  extended_text: 13.0.0`n  extended_text_field: 13.0.0"
          }
          $content | Set-Content $path
          
          # 2. Abhängigkeiten laden (erzeugt die Plugin-Ordner)
          flutter pub get
          
          # 3. C++ FIX: Fehlendes #include <chrono> im GPU Renderer Plugin hinzufügen
          # Wir suchen die Datei im ephemeral Ordner, wo sie nach 'pub get' liegt
          $targetFile = Get-ChildItem -Path "windows\flutter\ephemeral" -Filter "d3d11_output.cpp" -Recurse | Select-Object -First 1
          if ($targetFile) {
              $fileContent = Get-Content $targetFile.FullName
              if (!($fileContent -match "#include <chrono>")) {
                  Write-Host "Patching $($targetFile.FullName) with missing includes..."
                  $newHeader = "#include <chrono>`n#include <ratio>`n"
                  $newHeader + $fileContent | Set-Content $targetFile.FullName
              }
          }
          cd ..

      - name: Setup VCPKG
        shell: pwsh
        run: |
          if (!(Test-Path "vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git
          }
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
          cd ..

      - name: Generate Bridge Code
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files\LLVM\bin"
          $rustInput = if (Test-Path "src/flutter_ffi.rs") { "src/flutter_ffi.rs" } else { "src/api.rs" }
          $codegen = "$env:USERPROFILE\.cargo\bin\flutter_rust_bridge_codegen.exe"
          & $codegen --rust-input $rustInput --rust-output src/bridge_generated.rs --dart-output flutter/lib/generated_bridge.dart --no-build-runner
          cd flutter
          dart run build_runner build --delete-conflicting-outputs
          cd ..

      - name: Build Executable
        shell: cmd
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          RENDEZVOUS_SERVER: support.myGHL.com
          RS_PUB_KEY: hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ=
        run: |
          python build.py --portable --flutter

      - name: Prepare Artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Filter "rustdesk.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            Copy-Item -Path $exe.FullName -Destination "Support-GHL.exe"
            Write-Host "Artifact ready: Support-GHL.exe"
          } else {
            Write-Error "rustdesk.exe not found!"
            exit 1
          }

      - name: Upload Support Client
        uses: actions/upload-artifact@v4
        with:
          name: Support-GHL-Windows
          path: Support-GHL.exe
