name: Build RustDesk 1.3.6 Custom

on:
  workflow_dispatch: # Ermöglicht den manuellen Start

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6' # Stabil für RustDesk 1.3.6
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install LLVM & Dependencies
        run: |
          choco install llvm -y
          # Pfad für Clang setzen (wichtig für den Codegen)
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1
          # Sicherstellen, dass die .exe im PATH ist
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Patch Flutter Dependencies
        shell: pwsh
        run: |
          cd flutter
          # Wir hängen die Overrides Zeile für Zeile an, um Here-String Fehler zu vermeiden
          Add-Content -Path pubspec.yaml -Value "`n" # Sicherstellen, dass wir in einer neuen Zeile starten
          Add-Content -Path pubspec.yaml -Value "dependency_overrides:"
          Add-Content -Path pubspec.yaml -Value "  extended_text: 13.0.0"
          Add-Content -Path pubspec.yaml -Value "  extended_text_field: 13.0.0"
          
          # Zeig uns zur Sicherheit den Inhalt der Datei im Log an
          Write-Host "Geänderte pubspec.yaml:"
          Get-Content pubspec.yaml -Tail 10
          
          # Jetzt sollte pub get sauber laufen
          flutter pub get
          cd ..

      - name: Setup VCPKG
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          ./vcpkg install --classic libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static

      - name: Generate Bridge Code
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files\LLVM\bin"
          
          # Automatische Suche nach der Eingabedatei
          $rustInput = if (Test-Path "src/flutter_ffi.rs") { "src/flutter_ffi.rs" } else { "src/api.rs" }
          
          # Codegen starten - Dateiname MUSS generated_bridge.dart sein
          $codegen = "$env:USERPROFILE\.cargo\bin\flutter_rust_bridge_codegen.exe"
          & $codegen --rust-input $rustInput `
                     --rust-output src/bridge_generated.rs `
                     --dart-output flutter/lib/generated_bridge.dart `
                     --no-build-runner
          
          # Dart Generatoren finalisieren
          cd flutter
          dart run build_runner build --delete-conflicting-outputs
          cd ..

      - name: Build Executable
        shell: cmd
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          # DEINE SERVER-DATEN
          RENDEZVOUS_SERVER: support.myGHL.com
          RS_PUB_KEY: hKOqglvkNEtXCHSaxWQ4685okjzNUsVrSYk7EeHk9sQ=
        run: |
          python build.py --portable --flutter

      - name: Prepare Artifact
        shell: pwsh
        run: |
          # Suche die .exe im Projektordner (meistens in /target/release/ oder root)
          $exe = Get-ChildItem -Path . -Filter "rustdesk.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            Copy-Item -Path $exe.FullName -Destination "Support-GHL.exe"
          } else {
            Write-Error "Build erfolgreich, aber rustdesk.exe nicht gefunden!"
            exit 1
          }

      - name: Upload Support Client
        uses: actions/upload-artifact@v4
        with:
          name: Support-GHL-Windows
          path: Support-GHL.exe
